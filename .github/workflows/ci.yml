name: NeuroEase Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Check server syntax
        run: node --check server.js && node --check lib/password.js
      - name: Test password utilities
        run: npm test

  story-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-story.txt
      - name: Install story service dependencies
        run: python -m pip install -r requirements-story.txt
      - name: Compile Python services
        run: python -m py_compile session_api.py session_based_system.py quiz_engine.py
